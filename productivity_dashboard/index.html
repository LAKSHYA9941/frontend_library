<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Deck — Productivity Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================
       DYNAMIC BACKGROUND LAYER
       This sits behind everything and changes color
       based on the time of day (morning/afternoon/etc)
  ============================================ -->
  <div id="dynamic-bg"></div>

  <!-- ============================================
       TOP BAR — always visible, no matter which
       feature is open. Holds branding, date/time,
       and the theme switch.
  ============================================ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">FOCUS DECK</span>
    </div>

    <div id="datetime" class="datetime">
      <span id="date-text">--</span>
      <span id="time-text">--:--:--</span>
    </div>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark theme">
      <span class="toggle-track">
        <span class="toggle-thumb"></span>
      </span>
      <span id="theme-label">DARK</span>
    </button>
  </header>

  <!-- ============================================
       DASHBOARD (the "home screen")
       One card per feature. Clicking a card opens
       the matching full-screen feature view.
  ============================================ -->
  <main id="dashboard" class="dashboard">

    <!-- A small always-visible widget for weather -->
    <div class="widget-card weather-widget" id="weather-widget">
      <div class="widget-label">WEATHER</div>
      <div id="weather-body" class="weather-body">
        <span class="weather-loading">Fetching sky report…</span>
      </div>
    </div>

    <!-- Clickable feature cards -->
    <button class="feature-card" data-feature="todo">
      <span class="card-icon">✓</span>
      <span class="card-title">Todo List</span>
      <span class="card-sub">Capture & complete tasks</span>
    </button>

    <button class="feature-card" data-feature="planner">
      <span class="card-icon">▦</span>
      <span class="card-title">Daily Planner</span>
      <span class="card-sub">Plan it hour by hour</span>
    </button>

    <button class="feature-card" data-feature="goals">
      <span class="card-icon">◎</span>
      <span class="card-title">Daily Goals</span>
      <span class="card-sub">Small wins, tracked</span>
    </button>

    <button class="feature-card" data-feature="pomodoro">
      <span class="card-icon">◷</span>
      <span class="card-title">Pomodoro Timer</span>
      <span class="card-sub">25 on, 5 off</span>
    </button>

    <button class="feature-card" data-feature="quote">
      <span class="card-icon">❝</span>
      <span class="card-title">Motivation</span>
      <span class="card-sub">A nudge when you need one</span>
    </button>

  </main>

  <!-- ============================================
       FEATURE VIEWS
       Each one is hidden by default (class="feature-view")
       and shown full-screen when its card is clicked.
  ============================================ -->

  <!-- TODO LIST -->
  <section class="feature-view" id="view-todo" data-view="todo">
    <div class="feature-header">
      <h2>Todo List</h2>
      <button class="back-btn" data-close>← Back</button>
    </div>
    <div class="feature-body">
      <form id="todo-form" class="row-form">
        <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add Task</button>
      </form>
      <ul id="todo-list" class="item-list"></ul>
    </div>
  </section>

  <!-- DAILY PLANNER -->
  <section class="feature-view" id="view-planner" data-view="planner">
    <div class="feature-header">
      <h2>Daily Planner</h2>
      <button class="back-btn" data-close>← Back</button>
    </div>
    <div class="feature-body">
      <div id="planner-list" class="planner-list"></div>
    </div>
  </section>

  <!-- DAILY GOALS -->
  <section class="feature-view" id="view-goals" data-view="goals">
    <div class="feature-header">
      <h2>Daily Goals</h2>
      <button class="back-btn" data-close>← Back</button>
    </div>
    <div class="feature-body">
      <form id="goal-form" class="row-form">
        <input id="goal-input" type="text" placeholder="Set a goal for today" autocomplete="off" />
        <button type="submit">Add Goal</button>
      </form>
      <div id="goal-progress" class="progress-line">0 of 0 completed</div>
      <ul id="goal-list" class="item-list"></ul>
    </div>
  </section>

  <!-- POMODORO TIMER -->
  <section class="feature-view" id="view-pomodoro" data-view="pomodoro">
    <div class="feature-header">
      <h2>Pomodoro Timer</h2>
      <button class="back-btn" data-close>← Back</button>
    </div>
    <div class="feature-body pomodoro-body">
      <div id="session-label" class="session-label">WORK SESSION</div>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-pause">Pause</button>
        <button id="timer-reset">Reset</button>
      </div>
    </div>
  </section>

  <!-- MOTIVATION QUOTE -->
  <section class="feature-view" id="view-quote" data-view="quote">
    <div class="feature-header">
      <h2>Motivation</h2>
      <button class="back-btn" data-close>← Back</button>
    </div>
    <div class="feature-body quote-body">
      <blockquote id="quote-text" class="quote-text">Loading a good thought for you…</blockquote>
      <div id="quote-author" class="quote-author"></div>
      <button id="quote-new" class="quote-btn">New Quote</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
