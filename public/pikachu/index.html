<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pikachu UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">

</head>
<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <!-- LOGO -->
        <img
            class="logo"
            src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg"
            alt="Pokemon Logo"
        >

        <p class="sub">POKEMON GEN I</p>

        <h1>Pikachu</h1>

        <p class="description">
            Pikachu is an Electric-type Pokémon introduced
            in Generation I. Pikachu are small, chubby,
            and incredibly cute mouse-like Pokémon.
            They are almost completely covered by
            yellow fur.
        </p>

        <div class="counter">
            <div class="line"></div>
            01 / 08
        </div>

        
    </div>

    <!-- RIGHT -->

    <div class="right">

        <!-- MENU -->
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- PIKACHU -->
        <img
            class="pikachu"
            src="pikachu.png"
            alt="Pikachu"
        >

        <!-- DOTS -->
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

</div>

</body>
</html>
