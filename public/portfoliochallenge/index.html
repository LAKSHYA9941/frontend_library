<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<svg width="0" height="0" style="position: absolute">
    <clipPath id="smooth-profile-shape" clipPathUnits="objectBoundingBox">
        <path d="
      M 0.03 0.08
      L 0.30 0.08
      C 0.35 0.08, 0.40 0, 0.45 0
      L 0.97 0
      Q 1 0 , 1 0.03
      L 1 0.97
      Q 1 1 , 0.97 1
      L 0.03 1
      Q 0 1 , 0 0.97
      L 0 0.11
      Q 0 0.08, 0.03 0.08
      Z" />
    </clipPath>
</svg>

<body>
    <div class="container">
        <aside class="sidebar">

            <div class="side-menu">
                <span>Clients</span>
                <span>Research</span>
                <span>Portfolio</span>
                <span class="active">Podcast</span>
            </div>
        </aside>

        <div class="folder">
            <div class="profile-card">
                <div class="circle"></div>
                <img src="profile.png" class="profile-img" alt="pfp">
                <div class="profile-content">
                    <p>Im,</p>
                    <h2>Jon <br> Daniel</h2>
                    <span>inquiry@jondaniel.design</span>
                </div>
                <div class="badge">
                    <div class="inner-badge"></div>
                </div>
            </div>
        </div>


        <div class="right-section">
            <h1>Portfolio</h1>
            <div class="top-grid">
                <div class="video-card">
                    <img src="flamingo.jpg">
                    <div class="play-btn">
                        ▶
                    </div>
                </div>


                <div class="stats-column">
                    <div class="small-card mint">
                        <h2>251</h2>
                        <p>Projects</p>
                    </div>
                    <div class="small-card purple">
                        <h2>156</h2>
                        <p>Awards</p>
                    </div>
                </div>
            </div>




            <div class="bottom-grid">

                <div class="small-box dark">
                    <h3></h3>
                    <p>Clients</p>
                </div>

                <div class="combo-box">

                    <div class="black-side">
                        <img src="sphere.png">
                    </div>

                    <div class="award-side">
                        <h2>172</h2>
                        <p>Global Design Awards.</p>
                    </div>

                </div>

            </div>


        </div>
    </div>

</body>

</html>
