<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insect UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">

</head>
<body>

<div class="wrapper">

    <!-- LEFT -->

    <div class="left">

        <div class="logo">INSECT</div>

        <input type="text" class="search" placeholder="Search...">

        <div class="classification-title">Classification</div>

        <div class="list">

            <div class="item">
                <h4>Class:</h4>
                <p>Insecta</p>
            </div>

            <div class="item">
                <h4>Order:</h4>
                <p>Coleoptera</p>
            </div>

            <div class="item">
                <h4>Family:</h4>
                <p>Cerambycidae</p>
            </div>

            <div class="item">
                <h4>Sub-Family:</h4>
                <p>Cerambycinae</p>
            </div>

            <div class="item">
                <h4>Genus:</h4>
                <p>Pachyteria</p>
            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </div>

        <h1 class="title">
            Pachyteria <br>
            equestris
        </h1>

        <div class="info-grid">
            <div class="info-box">

                Locality: Malaysia <br>
                Sex: Male <br>
                Size: 32mm / 12mm
            </div>

        </div>

        <div class="price">$5.99</div>

        <div class="toggle">
            <div class="switch"></div>
            View detailed antennae
        </div>

        <div class="toggle">
            <div class="switch"></div>
            View underside
        </div>

        <button class="btn">Add to collection</button>

    </div>

    <!-- CENTER IMAGE -->

    <div class="bug">
        <img src="showcase.png" alt="Pachyteria equestris">
    </div>

</div>

</body>
</html>
